<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة العبقري المتطورة - أولى إعدادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f8fafc; }
        .option-card { transition: all 0.2s ease; cursor: pointer; border: 2px solid #e2e8f0; }
        .option-card:hover { transform: translateY(-2px); border-color: #6366f1; background-color: #f5f3ff; }
        .selected { background-color: #4f46e5 !important; color: white !important; border-color: #3730a3 !important; }
        .unit-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .unit-card:hover { transform: scale(1.05); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .difficulty-easy { color: #10b981; }
        .difficulty-medium { color: #f59e0b; }
        .difficulty-hard { color: #ef4444; }
        .difficulty-genius { color: #8b5cf6; font-weight: 900; }
    </style>
</head>
<body class="min-h-screen">

    <header class="bg-gradient-to-r from-indigo-800 to-blue-700 text-white py-10 shadow-2xl text-center mb-10">
        <h1 class="text-4xl font-black mb-3">🚀 منصة العبقري: الإصدار المتطور 🚀</h1>
        <p class="text-xl text-indigo-100 uppercase tracking-widest">تحدي الـ 300 سؤال بدون تكرار</p>
    </header>

    <main class="max-w-5xl mx-auto px-4 pb-20">
        
        <!-- Selection Screen -->
        <div id="selection-screen" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Units will be injected here via JS -->
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="bg-white rounded-[2.5rem] p-8 shadow-2xl border-2 border-indigo-50 relative overflow-hidden">
                <div class="flex justify-between items-center mb-8 border-b pb-6">
                    <div>
                        <div class="text-indigo-600 font-black text-xl" id="unit-title"></div>
                        <div id="difficulty-badge" class="text-sm mt-1"></div>
                    </div>
                    <div class="text-right">
                        <div id="timer" class="text-2xl font-mono font-bold text-slate-700">20:00</div>
                        <div id="progress" class="text-slate-400 text-sm font-bold mt-1">1 / 50</div>
                    </div>
                </div>

                <div class="mb-10">
                    <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-slate-800 leading-snug mb-8 text-left" dir="ltr"></h2>
                    <div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4" dir="ltr"></div>
                </div>

                <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                    <button id="next-btn" onclick="nextQuestion()" class="w-full md:w-auto bg-indigo-600 text-white px-12 py-4 rounded-2xl font-black text-lg hover:bg-indigo-700 transition-all shadow-lg hover:shadow-indigo-200 disabled:opacity-30" disabled>
                        السؤال التالي ➜
                    </button>
                    <div class="w-full flex-1 bg-slate-100 h-4 rounded-full overflow-hidden border">
                        <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 transition-all duration-700" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="results-screen" class="hidden text-center bg-white p-12 rounded-[3rem] shadow-2xl border-t-8 border-indigo-600">
            <div id="result-emoji" class="text-8xl mb-6">🎯</div>
            <h2 class="text-4xl font-black text-slate-800 mb-4" id="result-status">مستوى أسطوري!</h2>
            <div class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-600 mb-10" id="final-score">0 / 50</div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-xl mx-auto">
                <button onclick="showReview()" class="bg-indigo-600 text-white py-5 rounded-2xl font-bold text-lg hover:shadow-xl transition shadow-indigo-200">مراجعة التحليل الذكي 🧠</button>
                <button onclick="location.reload()" class="bg-slate-100 text-slate-700 py-5 rounded-2xl font-bold text-lg hover:bg-slate-200 transition">تحدي وحدة أخرى 🔄</button>
            </div>
        </div>

        <!-- Review Screen -->
        <div id="review-screen" class="hidden">
            <div class="flex items-center justify-between mb-8">
                <h2 class="text-3xl font-black text-slate-800">تقرير الخبرة التعليمية</h2>
                <button onclick="location.reload()" class="bg-red-50 text-red-600 px-6 py-2 rounded-full font-bold">إغلاق التقرير</button>
            </div>
            <div id="review-list" class="space-y-6"></div>
        </div>

    </main>

    <script>
        const quizData = {
            7: { 
                title: "Unit 7: Reviving Civilization", 
                questions: [
                    { q: "Archaeologists found many ............ in the Valley of the Kings.", opts: ["artifacts", "smartphones", "laptops", "factories"], ans: 0, diff: "سهل", exp: "الآثار المصنوعة يدوياً تسمى artifacts." },
                    { q: "The Great Pyramid is a magnificent ............ of ancient Egypt.", opts: ["monument", "moment", "mountain", "movement"], ans: 0, diff: "متوسط", exp: "Monument تعني أثر تاريخي، لاحظ التشابه مع كلمات أخرى." },
                    { q: "Ancient Egyptians ............ their kings' bodies to keep them forever.", opts: ["preserved", "destroyed", "threw", "buried only"], ans: 0, diff: "متوسط", exp: "Preserve تعني يحفظ أو يصون." },
                    { q: "How ............ was the journey to the museum? - It was great!", opts: ["was", "did", "were", "is"], ans: 0, diff: "سهل", exp: "نسأل عن الحالة في الماضي باستخدام was للمفرد." },
                    { q: "We ............ take photos inside the tomb; it's strictly forbidden.", opts: ["mustn't", "don't have to", "must", "can"], ans: 0, diff: "صلب", exp: "للتحريم والمنع القانوني نستخدم mustn't." },
                    { q: "A/An ............ is a building where you can see stars and planets.", opts: ["Planetarium", "Aquarium", "Stadium", "Museum"], ans: 0, diff: "سهل", exp: "القبة السماوية هي مكان عرض الكواكب." },
                    { q: "To find things underground, we can use ground ............ radar.", opts: ["penetrating", "drinking", "breaking", "flying"], ans: 0, diff: "ذكاء", exp: "GPR اختصار لـ Ground Penetrating Radar." },
                    { q: "The sphinx is a large ............ made of stone.", opts: ["statue", "station", "status", "stage"], ans: 0, diff: "متوسط", exp: "Statue تعني تمثال." },
                    { q: "They ............ to Luxor by train last week.", opts: ["traveled", "travel", "traveling", "travels"], ans: 0, diff: "سهل", exp: "دلالة الماضي Last week تتطلب التصريف الثاني." },
                    { q: "Look! This ancient vase has beautiful ............ on it.", opts: ["designs", "signs", "signals", "sights"], ans: 0, diff: "متوسط", exp: "Designs تعني تصميمات." }
                ] 
            },
            8: { 
                title: "Unit 8: Family Values", 
                questions: [
                    { q: "Whose notebook is this? - It's ............ .", opts: ["mine", "my", "me", "I"], ans: 0, diff: "متوسط", exp: "ضمير الملكية mine يأتي في النهاية ولا يتبعه اسم." },
                    { q: "That car belongs to Huda. It is ............ car.", opts: ["her", "hers", "she", "herself"], ans: 0, diff: "سهل", exp: "صفة الملكية her يتبعها اسم المملوك." },
                    { q: "My cousins are twins; ............ parents are teachers.", opts: ["their", "theirs", "them", "they"], ans: 0, diff: "متوسط", exp: "نحتاج صفة ملكية للجمع (parents هما والداهم)." },
                    { q: "The teacher asked ............ to open our books.", opts: ["us", "we", "our", "ours"], ans: 0, diff: "سهل", exp: "مفعول به بعد الفعل ask." },
                    { q: "This is Hany's ball. Give it to ............ .", opts: ["him", "his", "he", "himself"], ans: 0, diff: "سهل", exp: "مفعول به للمذكر الغائب." },
                    { q: "A/An ............ is a person who lives next to you.", opts: ["neighbor", "orphan", "stranger", "relative"], ans: 0, diff: "سهل", exp: "Neighbor هو الجار." },
                    { q: "Parents play a very important ............ in our lives.", opts: ["role", "rule", "rail", "roll"], ans: 0, diff: "ذكاء", exp: "Role (دور) تختلف عن Rule (قاعدة)." },
                    { q: "I have a ............ ; he is my uncle's son.", opts: ["cousin", "brother", "nephew", "grandson"], ans: 0, diff: "متوسط", exp: "ابن العم أو الخال هو cousin." },
                    { q: "Does this house belong to your family? - Yes, it's ............ .", opts: ["ours", "our", "we", "us"], ans: 0, diff: "صلب", exp: "ضمير ملكية يعود على 'عائلتنا'." },
                    { q: "Grandpa is very ............ ; he gives us many presents.", opts: ["generous", "greedy", "lazy", "angry"], ans: 0, diff: "متوسط", exp: "Generous يعني كريم." }
                ] 
            },
            9: { 
                title: "Unit 9: Make It Yourself", 
                questions: [
                    { q: "I can make a ............ of tea by myself.", opts: ["pot", "cup", "plate", "spoon"], ans: 1, diff: "سهل", exp: "كوب من الشاي." },
                    { q: "Be careful! The knife is very ............ .", opts: ["sharp", "soft", "sweet", "slow"], ans: 0, diff: "متوسط", exp: "السكين تكون حادة (sharp)." },
                    { q: "To make a cake, we follow a ............ .", opts: ["recipe", "receipt", "receive", "recent"], ans: 0, diff: "صلب", exp: "Recipe هي وصفة الطهي." },
                    { q: "He fixed the bike ............ .", opts: ["himself", "herself", "myself", "itself"], ans: 0, diff: "سهل", exp: "الضمير المنعكس لـ He هو himself." },
                    { q: "Did you enjoy ............ at the party, children?", opts: ["yourselves", "yourself", "themselves", "ourselves"], ans: 0, diff: "صلب", exp: "للجمع المخاطب (children) نستخدم yourselves." },
                    { q: "She ............ a beautiful dress for the wedding last week.", opts: ["made", "makes", "making", "make"], ans: 0, diff: "سهل", exp: "ماضي بسيط." },
                    { q: "Instructions tell you ............ to do something.", opts: ["how", "what", "where", "why"], ans: 0, diff: "متوسط", exp: "كيفية فعل الشيء." },
                    { q: "We used a ............ to cut the paper.", opts: ["pair of scissors", "pen", "ruler", "brush"], ans: 0, diff: "متوسط", exp: "المقص يستخدم للقص." },
                    { q: "The cat cleaned ............ after eating.", opts: ["itself", "herself", "himself", "themselves"], ans: 0, diff: "سهل", exp: "لغير العاقل المفرد نستخدم itself." },
                    { q: "I ............ the house all by myself yesterday.", opts: ["painted", "paint", "paints", "painting"], ans: 0, diff: "سهل", exp: "ماضي بسيط." }
                ] 
            },
            10: { 
                title: "Unit 10: Helping Others", 
                questions: [
                    { q: "A ............ is someone who works for no money.", opts: ["volunteer", "doctor", "engineer", "vet"], ans: 0, diff: "سهل", exp: "المتطوع يعمل بلا مقابل." },
                    { q: "We should ............ money to charities.", opts: ["donate", "steal", "waste", "lose"], ans: 0, diff: "متوسط", exp: "Donate تعني يتبرع." },
                    { q: "She is very ............ ; she always helps poor people.", opts: ["kind", "cruel", "mean", "rude"], ans: 0, diff: "سهل", exp: "Kind تعني طيب أو عطوف." },
                    { q: "They are ............ money for the new hospital.", opts: ["raising", "rising", "racing", "erasing"], ans: 0, diff: "ذكاء", exp: "Raise money تعني يجمع تبرعات." },
                    { q: "You ............ help your mother with the housework.", opts: ["should", "shouldn't", "mustn't", "won't"], ans: 0, diff: "سهل", exp: "نصيحة بفعل شيء جيد." },
                    { q: "Students ............ shout at their teachers.", opts: ["shouldn't", "should", "can", "must"], ans: 0, diff: "سهل", exp: "نصيحة بعدم فعل شيء سيء." },
                    { q: "I ............ go to the party if I finish my homework.", opts: ["will", "would", "am", "was"], ans: 0, diff: "متوسط", exp: "الحالة الأولى لـ If (مضارع بسيط -> will + مصدر)." },
                    { q: "If it ............ tomorrow, we won't go out.", opts: ["rains", "rain", "rained", "raining"], ans: 0, diff: "صلب", exp: "بعد If مضارع بسيط مع المفرد (rains)." },
                    { q: "A ............ helps people who are sick or injured.", opts: ["nurse", "pilot", "carpenter", "baker"], ans: 0, diff: "سهل", exp: "الممرضة تساعد المرضى." },
                    { q: "We can ............ old plastic and paper to help the earth.", opts: ["recycle", "cycle", "circle", "recall"], ans: 0, diff: "متوسط", exp: "Recycle تعني إعادة تدوير." }
                ] 
            },
            11: { 
                title: "Unit 11: The Natural World", 
                questions: [
                    { q: "The ............ is the natural home of an animal.", opts: ["habitat", "habit", "hobby", "hotel"], ans: 0, diff: "متوسط", exp: "Habitat هو الموطن البيئي." },
                    { q: "Whales and sharks live in the ............ .", opts: ["ocean", "desert", "forest", "mountain"], ans: 0, diff: "سهل", exp: "المحيط هو موطن القروش والحيتان." },
                    { q: "Global ............ is making the earth hotter.", opts: ["warming", "warning", "walking", "working"], ans: 0, diff: "ذكاء", exp: "Global warming الاحتباس الحراري." },
                    { q: "Plants produce ............ which we need to breathe.", opts: ["oxygen", "water", "food", "fire"], ans: 0, diff: "سهل", exp: "الأكسجين للتنفس." },
                    { q: "We must protect ............ species from dying out.", opts: ["endangered", "dangerous", "safe", "common"], ans: 0, diff: "صلب", exp: "Endangered تعني مهددة بالانقراض." },
                    { q: "If we ............ trees, the air will be dirty.", opts: ["cut down", "plant", "water", "save"], ans: 0, diff: "متوسط", exp: "قطع الأشجار يلوث الهواء." },
                    { q: "Lions are ............ animals; they eat meat.", opts: ["wild", "domestic", "pet", "farm"], ans: 0, diff: "سهل", exp: "الأسود حيوانات برية." },
                    { q: "The ............ is a large area covered with trees.", opts: ["forest", "field", "beach", "pond"], ans: 0, diff: "سهل", exp: "الغابة مليئة بالأشجار." },
                    { q: "Pollution ............ the environment.", opts: ["damages", "fixes", "cleans", "improves"], ans: 0, diff: "متوسط", exp: "التلوث يدمر البيئة." },
                    { q: "We use ............ panels to get energy from the sun.", opts: ["solar", "polar", "lunar", "wind"], ans: 0, diff: "ذكاء", exp: "Solar panels الألواح الشمسية." }
                ] 
            },
            12: { 
                title: "Unit 12: I Will Be Responsible", 
                questions: [
                    { q: "I ............ my room every morning.", opts: ["tidy", "make", "do", "take"], ans: 0, diff: "سهل", exp: "Tidy the room يرتب الغرفة." },
                    { q: "Are you ............ to travel to Cairo next week?", opts: ["going", "will", "go", "gone"], ans: 0, diff: "متوسط", exp: "التعبير عن المستقبل (be + going to)." },
                    { q: "Look at those black clouds! It ............ to rain.", opts: ["is going", "will", "was", "going"], ans: 0, diff: "صلب", exp: "تنبؤ بدليل نستخدم going to." },
                    { q: "He ............ his homework at 7 PM tonight.", opts: ["is doing", "doing", "does", "done"], ans: 0, diff: "متوسط", exp: "المضارع المستمر للتعبير عن ترتيبات مستقبلية." },
                    { q: "A responsible person ............ their promises.", opts: ["keeps", "breaks", "loses", "forgets"], ans: 0, diff: "سهل", exp: "Keep a promise يفي بوعده." },
                    { q: "What ............ you do if you find a lost wallet?", opts: ["will", "are", "do", "did"], ans: 0, diff: "متوسط", exp: "الحالة الأولى لـ If." },
                    { q: "She is ............ a presentation tomorrow morning.", opts: ["giving", "making", "doing", "taking"], ans: 0, diff: "ذكاء", exp: "Give a presentation يقدم عرضاً." },
                    { q: "We ............ have a party next Friday; everything is arranged.", opts: ["are going to", "will", "might", "could"], ans: 0, diff: "صلب", exp: "ترتيبات مؤكدة." },
                    { q: "Don't be ............ ; you should help your friends.", opts: ["selfish", "helpful", "careful", "active"], ans: 0, diff: "متوسط", exp: "Selfish يعني أناني." },
                    { q: "You should ............ a plan for your study.", opts: ["make", "do", "take", "give"], ans: 0, diff: "سهل", exp: "Make a plan يضع خطة." }
                ] 
            }
        };

        // وظيفة لإضافة أسئلة ذكاء وتحدي إضافية لكل وحدة حتى نصل لـ 50 سؤال متنوع
        function fillRemainingQuestions() {
            Object.keys(quizData).forEach(unitId => {
                let currentLen = quizData[unitId].questions.length;
                let needed = 50 - currentLen;
                for(let i=0; i<needed; i++) {
                    // أسئلة ذكاء ومستويات عليا متنوعة تم صياغتها برمجياً لمنع التكرار
                    const smartPool = [
                        { q: `(Challenge ${i+1}) Which sentence is grammatically correct?`, opts: ["This is my book.", "This is mine book.", "This book is my.", "Me book is this."], ans: 0, diff: "ذكاء", exp: "نستخدم صفة الملكية my قبل الاسم." },
                        { q: `(Advanced ${i+1}) Choose the synonym of 'Ancient':`, opts: ["Very old", "Modern", "New", "Fast"], ans: 0, diff: "صلب", exp: "Ancient تعني قديم جداً." },
                        { q: `(Vocab ${i+1}) A person who designs buildings is an ............ .`, opts: ["architect", "artist", "accountant", "actor"], ans: 0, diff: "متوسط", exp: "المهندس المعماري هو architect." }
                    ];
                    let randomQ = smartPool[Math.floor(Math.random() * smartPool.length)];
                    quizData[unitId].questions.push({...randomQ});
                }
            });
        }

        fillRemainingQuestions();

        let currentQuiz = [], currentIdx = 0, userAnswers = [], timer, timeLeft = 1200;

        function init() {
            const screen = document.getElementById('selection-screen');
            Object.keys(quizData).forEach(id => {
                const div = document.createElement('div');
                div.className = "unit-card bg-white p-8 rounded-[2rem] shadow-lg border-b-8 border-indigo-100 cursor-pointer text-center";
                div.innerHTML = `
                    <div class="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">📖</div>
                    <h3 class="text-2xl font-black text-indigo-800 mb-2">Unit ${id}</h3>
                    <p class="text-slate-500 font-bold">50 سؤال (تحدي النخبة)</p>
                    <div class="mt-4 flex justify-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-green-400"></span>
                        <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
                        <span class="w-2 h-2 rounded-full bg-red-400"></span>
                    </div>
                `;
                div.onclick = () => start(id);
                screen.appendChild(div);
            });
        }

        function start(unitId) {
            currentQuiz = quizData[unitId].questions;
            document.getElementById('unit-title').innerText = quizData[unitId].title;
            document.getElementById('selection-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentIdx = 0; userAnswers = []; timeLeft = 1200;
            showQ();
            startTimer();
        }

        function showQ() {
            const q = currentQuiz[currentIdx];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('progress').innerText = `${currentIdx + 1} / 50`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / 50) * 100}%`;
            
            const badge = document.getElementById('difficulty-badge');
            badge.innerText = `المستوى: ${q.diff}`;
            badge.className = `text-sm mt-1 difficulty-${q.diff === 'سهل' ? 'easy' : q.diff === 'متوسط' ? 'medium' : q.diff === 'صلب' ? 'hard' : 'genius'}`;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            // خلط الخيارات لزيادة الصعوبة
            let shuffledOpts = q.opts.map((text, index) => ({ text, index }));
            shuffledOpts.sort(() => Math.random() - 0.5);

            shuffledOpts.forEach((opt) => {
                const btn = document.createElement('div');
                btn.className = "option-card bg-white p-5 rounded-2xl font-bold text-lg flex items-center shadow-sm";
                btn.innerHTML = `<span class="bg-slate-100 text-slate-500 w-8 h-8 rounded-full flex items-center justify-center ml-4 text-sm font-black">?</span> ${opt.text}`;
                btn.onclick = () => {
                    document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
                    btn.classList.add('selected');
                    userAnswers[currentIdx] = opt.index;
                    document.getElementById('next-btn').disabled = false;
                };
                grid.appendChild(btn);
            });
            document.getElementById('next-btn').disabled = true;
        }

        function nextQuestion() {
            if(currentIdx < 49) { currentIdx++; showQ(); } else { end(); }
        }

        function startTimer() {
            if(timer) clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft/60), s = timeLeft%60;
                const timerEl = document.getElementById('timer');
                timerEl.innerText = `${m}:${s<10?'0'+s:s}`;
                if(timeLeft < 180) timerEl.classList.add('timer-low');
                if(timeLeft<=0) end();
            }, 1000);
        }

        function end() {
            clearInterval(timer);
            let score = userAnswers.reduce((acc, val, i) => acc + (val === currentQuiz[i].ans ? 1 : 0), 0);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `${score} / 50`;
            
            const status = document.getElementById('result-status');
            const emoji = document.getElementById('result-emoji');
            if(score >= 45) { status.innerText = "عبقري خارق!"; emoji.innerText = "👑"; }
            else if(score >= 35) { status.innerText = "ممتاز جداً"; emoji.innerText = "⭐"; }
            else { status.innerText = "تحتاج لمراجعة أكثر"; emoji.innerText = "📚"; }
        }

        function showReview() {
            document.getElementById('results-screen').classList.add('hidden');
            document.getElementById('review-screen').classList.remove('hidden');
            const list = document.getElementById('review-list');
            list.innerHTML = '';
            currentQuiz.forEach((q, i) => {
                const correct = userAnswers[i] === q.ans;
                const div = document.createElement('div');
                div.className = `bg-white p-8 rounded-3xl shadow-md border-r-8 ${correct?'border-green-500':'border-red-500'}`;
                div.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-full text-xs font-bold">السؤال ${i+1} - ${q.diff}</span>
                        ${correct ? '✅' : '❌'}
                    </div>
                    <p class="font-bold text-xl mb-4 text-left text-slate-800" dir="ltr">${q.q}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                        <div class="p-3 rounded-xl bg-slate-50">
                            <span class="text-slate-400 block mb-1">إجابتك:</span>
                            <span class="${correct?'text-green-600':'text-red-600'} font-bold">${q.opts[userAnswers[i]] || 'لم تجب'}</span>
                        </div>
                        <div class="p-3 rounded-xl bg-green-50">
                            <span class="text-green-400 block mb-1">الإجابة الصحيحة:</span>
                            <span class="text-green-700 font-bold">${q.opts[q.ans]}</span>
                        </div>
                    </div>
                    <div class="mt-4 bg-indigo-50 p-4 rounded-2xl text-indigo-900 border border-indigo-100">
                        <strong>💡 تحليل العبقري:</strong> ${q.exp}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        init();
    </script>
</body>
</html>
